version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Bundle low-risk patch/minor bumps into one PR instead of one PR per
      # package - keeps the PR queue reviewable. Major bumps (framework
      # upgrades etc.) still get their own PR since those need real review.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
